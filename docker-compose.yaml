services:
  postgres:
    image: postgres:17
    container_name: trivago-postgres

    environment:
      POSTGRES_DB: trivago
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes: 
  postgres_data:
